<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAC DZ PRO — منصة البكالوريا</title>
<style>
:root{--n:#071a36;--b:#1677ff;--g:#ffbf22;--bg:#f4f7fb;--t:#14233b;--m:#6d7b91;--l:#e4eaf2;--w:#fff;--ok:#15955a;--bad:#d93d3d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--t)}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(1150px,92%);margin:auto}
header{height:70px;background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-weight:800;font-size:20px}.brand small{display:block;color:#b8c9df;font-size:10px;font-weight:400}.nav{display:flex;gap:8px}.nav button{border:0;background:transparent;color:#fff;padding:9px}.gold{background:var(--g)!important;color:#111!important;border-radius:10px!important;font-weight:700}
main{padding:28px 0}.hero{background:linear-gradient(135deg,var(--n),#14558d);color:#fff;border-radius:24px;padding:32px}.hero h1{margin:0 0 7px}.hero p{color:#d7e4f2}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.blue{background:var(--b);color:#fff}.light{background:#edf4ff;color:#1768ca}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:18px 0}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 6px 25px #18365b0a}.kpi b{font-size:27px;display:block}.muted{color:var(--m);font-size:13px}.layout{display:grid;grid-template-columns:1.35fr .8fr;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:8px;background:#e6ebf2;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.subject{margin:14px 0}.question{font-size:21px}.option{width:100%;text-align:right;background:#fff;border:1px solid var(--l);padding:12px;border-radius:11px;margin:7px 0}.option.sel{border:2px solid var(--b);background:#edf5ff}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.box{background:#fff;border-radius:20px;padding:25px;width:min(440px,100%)}.box input,.box select{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;margin:7px 0 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--l);text-align:right;white-space:nowrap}.danger{background:#fff0f0;color:var(--bad)}.notice{padding:12px;background:#fff9e8;border:1px solid #f3d77b;border-radius:10px}.hide{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.hero{padding:24px}.nav button:not(.gold){display:none}}
</style></head><body>
<div id="app"></div>
<div id="modal" class="modal"><div class="box" id="modalBox"></div></div>
<script>
const branches=["علوم تجريبية","تقني رياضي","تسيير واقتصاد","آداب وفلسفة"];
let token=localStorage.getItem("bac_token"), me=null, qs=[], qIndex=0, selected=null;
const app=document.getElementById("app"), modal=document.getElementById("modal");
async function api(url,opt={}){opt.headers={...(opt.headers||{}), "Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error(d.error||"انتهت الجلسة")}if(!r.ok)throw Error(d.error||"حدث خطأ");return d}
function showModal(html){document.getElementById("modalBox").innerHTML=html;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()})
function shell(){return `<header><div class="brand">🎓 BAC DZ PRO<small>منصة البكالوريا الجزائرية</small></div><div class="nav"><button onclick="dashboard()">الرئيسية</button><button onclick="quiz()">QCM</button>${me?.role==="admin"?`<button onclick="admin()">Admin</button>`:""}<button class="gold" onclick="logout()">خروج</button></div></header><main class="wrap" id="main"></main>`}
async function boot(){if(!token){loginPage();return}try{let d=await api("/api/me");me=d.user;dashboard()}catch(e){loginPage()}}
function loginPage(){app.innerHTML=`<main class="wrap" style="max-width:500px;padding-top:70px"><div class="card"><div class="brand" style="color:var(--n)">🎓 BAC DZ PRO<small style="color:var(--m)">منصة البكالوريا الجزائرية</small></div><h1>تسجيل الدخول</h1><p class="muted">أو أنشئ حساب طالب جديد.</p><input id="email" placeholder="البريد الإلكتروني" style="width:100%;padding:12px;border:1px solid var(--l);border-radius:10px"><input id="pass" type="password" placeholder="كلمة المرور" style="width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;margin:9px 0"><button class="btn blue" style="width:100%" onclick="login()">دخول</button><button class="btn light" style="width:100%;margin-top:8px" onclick="registerForm()">إنشاء حساب طالب</button></div></main>`}
async function login(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})});token=d.token;localStorage.setItem("bac_token",token);me=d.user;dashboard()}catch(e){alert(e.message)}}
function registerForm(){showModal(`<h2>إنشاء حساب طالب</h2><input id="rn" placeholder="الاسم الكامل"><input id="re" placeholder="البريد الإلكتروني"><input id="rp" type="password" placeholder="كلمة المرور — 8 أحرف على الأقل"><select id="rb">${branches.map(x=>`<option>${x}</option>`).join("")}</select><button class="btn blue" style="width:100%" onclick="register()">إنشاء الحساب</button>`)}
async function register(){try{let d=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:rn.value,email:re.value,password:rp.value,branch:rb.value})});token=d.token;localStorage.setItem("bac_token",token);me=d.user;closeModal();dashboard()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem("bac_token");token=null;me=null;loginPage()}
async function dashboard(){app.innerHTML=shell();let d=await api("/api/me");me=d.user;document.getElementById("main").innerHTML=`<div class="hero"><h1>مرحبًا ${esc(me.name)} 👋</h1><p>شعبتك: ${esc(me.branch)} — بياناتك محفوظة في قاعدة البيانات.</p><button class="btn gold" onclick="quiz()">ابدأ QCM الآن →</button></div><div class="grid"><div class="card kpi"><b>${Number(me.avg).toFixed(1)}</b><span>آخر معدل محسوب / 20</span></div><div class="card kpi"><b>${d.attempts.length}</b><span>آخر الاختبارات</span></div><div class="card kpi"><b>${d.attempts.reduce((a,x)=>a+x.score,0)}</b><span>إجابات صحيحة</span></div><div class="card kpi"><b>${me.role==="admin"?"مدير":"طالب"}</b><span>نوع الحساب</span></div></div><div class="layout"><div class="card"><h2>📈 سجل الاختبارات</h2>${d.attempts.length?d.attempts.map(x=>`<div class="row" style="padding:11px 0;border-bottom:1px solid var(--l)"><span>اختبار QCM</span><b>${x.score}/${x.total}</b></div>`).join(""):"<p class='muted'>لم تجتز أي اختبار بعد.</p>"}</div><div class="card"><h2>🎯 خطة اليوم</h2><p>حل أسئلة، راجع الأخطاء ثم أعد الاختبار.</p><button class="btn blue" onclick="quiz()">فتح QCM</button></div></div>`}
async function quiz(){app.innerHTML=shell();try{let d=await api("/api/questions");qs=d.questions;qIndex=0;selected=null;if(!qs.length){document.getElementById("main").innerHTML=`<div class="card"><h2>لا توجد أسئلة بعد</h2><p class="muted">سيضيف المدير الأسئلة من لوحة Admin.</p></div>`;return}renderQ()}catch(e){alert(e.message)}}
function renderQ(){let q=qs[qIndex];document.getElementById("main").innerHTML=`<div class="card"><div class="row"><b>QCM</b><span>${qIndex+1}/${qs.length}</span></div><hr><p class="muted">${esc(q.subject)} — ${esc(q.branch)}</p><div class="question">${esc(q.question)}</div>${["option_a","option_b","option_c","option_d"].map((k,i)=>`<button class="option ${selected===i?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)} — ${esc(q[k])}</button>`).join("")}<div style="margin-top:15px"><button class="btn blue" onclick="nextQ()">${qIndex===qs.length-1?"إنهاء الاختبار":"التالي"}</button></div></div>`}
function pick(i){selected=i;renderQ()}
async function nextQ(){if(selected===null)return alert("اختر إجابة أولاً");qs[qIndex].selected=selected;if(qIndex<qs.length-1){qIndex++;selected=null;renderQ();return}try{let d=await api("/api/quiz/submit",{method:"POST",body:JSON.stringify({answers:qs.map(q=>({id:q.id,answer:q.selected}))})});document.getElementById("main").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:55px">🏆</div><h1>نتيجتك: ${d.score}/${d.total}</h1><p>النسبة: ${d.percentage}%</p><button class="btn blue" onclick="dashboard()">لوحة التحكم</button></div>`}catch(e){alert(e.message)}}
async function admin(){if(me?.role!=="admin")return alert("غير مصرح");app.innerHTML=shell();let s=await api("/api/admin/stats");document.getElementById("main").innerHTML=`<div class="hero"><h1>لوحة Admin 🛡️</h1><p>إدارة الطلاب والأسئلة من قاعدة البيانات الحقيقية.</p></div><div class="grid"><div class="card kpi"><b>${s.students}</b><span>الطلاب</span></div><div class="card kpi"><b>${s.questions}</b><span>الأسئلة</span></div><div class="card kpi"><b>${s.attempts}</b><span>محاولات الاختبار</span></div><div class="card kpi"><b>${s.admins}</b><span>المديرون</span></div></div><div class="tabs"><button class="btn blue" onclick="adminUsers()">👥 الطلاب</button><button class="btn gold" onclick="adminQuestions()">📝 الأسئلة</button></div><div id="adminPanel"></div>`}
async function adminUsers(){let d=await api("/api/admin/users");document.getElementById("adminPanel").innerHTML=`<div class="card"><h2>الطلاب</h2><div class="tablewrap"><table class="table"><tr><th>الاسم</th><th>البريد</th><th>الشعبة</th><th>المعدل</th><th></th></tr>${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.branch)}</td><td>${u.avg}</td><td>${u.role==="student"?`<button class="btn danger" onclick="delUser(${u.id})">حذف</button>`:"Admin"}</td></tr>`).join("")}</table></div></div>`}
async function delUser(id){if(!confirm("حذف الطالب؟"))return;try{await api("/api/admin/users/"+id,{method:"DELETE"});adminUsers()}catch(e){alert(e.message)}}
async function adminQuestions(){let d=await api("/api/admin/questions");document.getElementById("adminPanel").innerHTML=`<div class="card"><div class="row"><h2>الأسئلة</h2><button class="btn blue" onclick="addQuestion()">+ سؤال</button></div>${d.questions.map(q=>`<div style="border-bottom:1px solid var(--l);padding:13px 0"><b>${esc(q.subject)} — ${esc(q.branch)}</b><p>${esc(q.question)}</p><button class="btn danger" onclick="delQuestion(${q.id})">حذف</button></div>`).join("")||"<p class='muted'>لا توجد أسئلة.</p>"}</div>`}
function addQuestion(){showModal(`<h2>إضافة سؤال</h2><input id="qs" placeholder="المادة"><input id="qb" placeholder="الشعبة أو عام"><input id="qq" placeholder="السؤال"><input id="qa" placeholder="الخيار A"><input id="qc" placeholder="الخيار B"><input id="qd" placeholder="الخيار C"><input id="qe" placeholder="الخيار D"><select id="qi"><option value="0">الإجابة A</option><option value="1">الإجابة B</option><option value="2">الإجابة C</option><option value="3">الإجابة D</option></select><button class="btn blue" style="width:100%" onclick="saveQuestion()">حفظ السؤال</button>`)}
async function saveQuestion(){try{await api("/api/admin/questions",{method:"POST",body:JSON.stringify({subject:qs.value,branch:qb.value,question:qq.value,options:[qa.value,qc.value,qd.value,qe.value],correctIndex:Number(qi.value)})});closeModal();adminQuestions()}catch(e){alert(e.message)}}
async function delQuestion(id){if(!confirm("حذف السؤال؟"))return;try{await api("/api/admin/questions/"+id,{method:"DELETE"});adminQuestions()}catch(e){alert(e.message)}}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
boot();
</script></body></html>
